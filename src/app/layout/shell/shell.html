<div class="app-shell">

  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon">T</div>

      <div>
        <div class="logo-name">Titan Fitness</div>
        <div class="logo-subtitle">Staff Portal</div>
      </div>
    </div>

    <button class="check-in-button btn btn-primary" type="button" routerLink="/members">
      <i class="fa-solid fa-right-to-bracket me-2" aria-hidden="true"></i>New Check-in
    </button>

    <nav class="menu">

      <a routerLink="/dashboard" routerLinkActive="active">
        <i class="fa-solid fa-gauge-high" aria-hidden="true"></i>
        Dashboard
      </a>

      <a routerLink="/members" routerLinkActive="active">
        <i class="fa-solid fa-users" aria-hidden="true"></i>
        Members
      </a>

      <a routerLink="/classes" routerLinkActive="active">
        <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
        Classes
      </a>

      <a routerLink="/trainers" routerLinkActive="active">
        <i class="fa-solid fa-dumbbell" aria-hidden="true"></i>
        Trainers
      </a>

      <a routerLink="/plans" routerLinkActive="active">
        <i class="fa-solid fa-tags" aria-hidden="true"></i>
        Plans
      </a>

    </nav>

  </aside>

  <div class="main-area">

    <header class="header">

      <div class="search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <span>Search...</span>
      </div>

      <div class="header-right">
        <strong>Downtown Branch</strong>
        <i class="fa-regular fa-bell" aria-label="Notifications"></i>
        <i class="fa-solid fa-gear" aria-label="Settings"></i>
        <i class="fa-regular fa-circle-user" aria-label="User profile"></i>
      </div>

    </header>

    <main class="content">
      <ng-content></ng-content>
    </main>

  </div>

</div>
