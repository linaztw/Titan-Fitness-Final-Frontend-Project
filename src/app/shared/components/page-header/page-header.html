<header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
  <div>
    <h1 class="app-page-title mb-1">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="app-page-subtitle mb-0">{{ subtitle() }}</p>
    }
  </div>
  @if (actionLabel()) {
    <button class="btn btn-primary" type="button" (click)="action.emit()">
      @if (actionIcon()) { <i [class]="actionIcon() + ' me-2'" aria-hidden="true"></i> }
      {{ actionLabel() }}
    </button>
  }
</header>
