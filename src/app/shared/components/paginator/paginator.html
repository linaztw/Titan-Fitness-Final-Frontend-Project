<nav aria-label="Pagination">
  <ul class="pagination mb-0">
    <li class="page-item" [class.disabled]="page() === 1">
      <button class="page-link" type="button" aria-label="Previous page"
        [disabled]="page() === 1" (click)="pageChange.emit(page() - 1)">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
    </li>
    @for (number of pages(); track number) {
      <li class="page-item" [class.active]="page() === number">
        <button class="page-link" type="button" [attr.aria-current]="page() === number ? 'page' : null"
          (click)="pageChange.emit(number)">{{ number }}</button>
      </li>
    }
    <li class="page-item" [class.disabled]="page() === totalPages()">
      <button class="page-link" type="button" aria-label="Next page"
        [disabled]="page() === totalPages()" (click)="pageChange.emit(page() + 1)">
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    </li>
  </ul>
</nav>
